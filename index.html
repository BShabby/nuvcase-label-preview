:root{--bg:#e4e4e4;--surface:#f0f0f0;--border:#000;--fg:#000;--fg-muted:#333;--accent:#000;--accent-light:#bdbdbd;--radius:10px;--input-bg:#fff;--font-btn-bg:#ebebeb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1714;--surface:#252220;--border:#3a3530;--fg:#f0ece6;--fg-muted:#9a9490;--accent:#d4845a;--accent-light:#2a1e14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1714;--surface:#252220;--border:#3a3530;--fg:#f0ece6;--fg-muted:#9a9490;--accent:#d4845a;--accent-light:#2a1e14;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.5;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.header{text-align:center}
.header h1{font-family:Oswald,sans-serif;font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-muted)}
.header p{font-size:11px;color:var(--fg-muted);margin-top:3px}
.preview-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 16px;display:flex;align-items:center;justify-content:center}
.label-container{position:relative;width:min(280px,80vw);height:min(90px,25vw);flex-shrink:0;transition:height .25s}  .label-container.two-line{height:min(120px,33vw)}
.label-bg{width:100%;height:100%;object-fit:fill;display:block;border-radius:4px}
.label-text-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 20px;pointer-events:none}
.text-line{color:#2a1a0e;line-height:1.15;text-align:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.controls{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.section{padding:14px 16px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none}
.sec-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:10px}
.toggle-group{display:flex;gap:8px}
.toggle-btn{flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:6px;background:transparent;color:var(--fg);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
.toggle-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:600}
.input-row{display:flex;flex-direction:column;gap:8px}
.sub-lbl{font-size:11px;color:var(--fg-muted);letter-spacing:.05em;margin-bottom:4px}
.text-input{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:6px;background:#fff;color:var(--fg);font-size:16px;font-family:inherit;outline:none;transition:border-color .15s}
.text-input:focus{border-color:var(--accent)}
.font-row-wrap{display:flex;flex-direction:column;gap:10px}
.font-row-lbl{font-size:11px;color:var(--fg-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:5px}
.font-btn{padding:9px 8px;border:1.5px solid var(--border);border-radius:6px;background:#ebebeb;color:var(--fg);cursor:pointer;transition:all .15s;text-align:center;font-size:15px;line-height:1.2}
.font-btn .fn{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);margin-top:3px;font-family:-apple-system,sans-serif}
.font-btn.active{border-color:var(--accent);background:var(--accent-light)}
.font-btn.active .fn{color:var(--accent)}
.size-rows{display:flex;flex-direction:column;gap:8px}
.size-row{display:flex;align-items:center;gap:8px}
.sz-lbl{font-size:11px;color:var(--fg-muted);width:38px;flex-shrink:0}
.size-btns{display:flex;gap:5px;flex:1}
.size-btn{flex:1;padding:6px 4px;border:1.5px solid var(--border);border-radius:5px;background:transparent;color:var(--fg);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit}
.size-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:600}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px}
.emoji-btn{width:64px;padding:8px 4px 6px;border:1.5px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.emoji-btn svg{width:30px;height:30px;color:#2a1a0e;display:block}
.emoji-btn .fn{font-size:9px;color:var(--fg-muted);font-family:-apple-system,sans-serif;letter-spacing:.03em}
.emoji-btn.active{border-color:var(--accent);background:var(--accent-light)}
.emoji-btn.active .fn{color:var(--accent)}
</style>

<div class="app">
  <div class="header">
    <h1>Nuvcase · Leather Label</h1>
    <p>커스텀 각인 미리보기</p>
  </div>
  <div class="preview-wrap">
    <div class="label-container">
      <img class="label-bg" id="labelImg" alt="label">
      <div class="label-text-overlay">
        <div class="text-line" id="d1">Your Text</div>
        <div class="text-line" id="d2"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="section">
      <div class="sec-lbl">텍스트</div>
      <div style="font-size:11px;color:#888;margin-bottom:8px">1줄 또는 2줄로 구성해보세요</div>
      <div class="input-row">
        <div><div class="sub-lbl">1번째 줄</div><input class="text-input" id="in1" type="text" placeholder="예) WanderLust" maxlength="20" oninput="render()" onfocus="lastInp='in1';buildFontGrid();updateFontHint()"></div>
        <div id="in2wrap"><div class="sub-lbl">2번째 줄</div><input class="text-input" id="in2" type="text" placeholder="2번째 줄 비우면 한줄로 제작합니다" maxlength="20" oninput="render()" onfocus="lastInp='in2';buildFontGrid();updateFontHint()"></div>
      </div>
    </div>
    <div class="section" id="fontSec">
      <div class="sec-lbl" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0">
        <span>폰트</span>
        <span id="fontTabHint" style="font-size:11px;color:#888;font-weight:normal">1번째 줄</span>
      </div>
      <div style="margin-top:10px" id="fgWrap">
        <div class="font-row-lbl">English</div><div class="font-grid fg-en" style="margin-bottom:10px"></div>
        <div class="font-row-lbl">한글</div><div class="font-grid fg-kr"></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-lbl">크기</div>
      <div class="size-rows">
        <div class="size-row">
          <span class="sz-lbl" id="szlbl1">1단 문구</span>
          <div class="size-btns">
            <button class="size-btn" id="s1s" onclick="setSz(1,'s')">소</button>
            <button class="size-btn active" id="s1m" onclick="setSz(1,'m')">중</button>
            <button class="size-btn" id="s1l" onclick="setSz(1,'l')">대</button>
          </div>
        </div>
        <div class="size-row" id="szRow2">
          <span class="sz-lbl">2단 문구</span>
          <div class="size-btns">
            <button class="size-btn" id="s2s" onclick="setSz(2,'s')">소</button>
            <button class="size-btn active" id="s2m" onclick="setSz(2,'m')">중</button>
            <button class="size-btn" id="s2l" onclick="setSz(2,'l')">대</button>
          </div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="sec-lbl">이모티콘</div>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>
  </div>
</div>

var SZ = {one:{l:34,m:28,s:22}, two1:{l:28,m:22,s:17}, two2:{l:28,m:22,s:17}};
var st = {lines:2, f0:'f4', f1:'f4', f2:'f4', sz1:'m', sz2:'m'};

function fObj(key){ return FONTS.find(function(f){return f.key===key;}); }

var fontTab = 1; // 1 or 2, only relevant in 2-line mode

function buildFontGrid() {
  var stateKey = (lastInp === 'in2') ? 'f2' : 'f1';
  var wrap = document.getElementById('fgWrap');
  var enEl = wrap.querySelector('.fg-en');
  var krEl = wrap.querySelector('.fg-kr');
  var htmlEn = '', htmlKr = '';
  for (var i=0; i<FONTS_EN.length; i++) {
    var f = FONTS_EN[i];
    var active = (st[stateKey] === f.key) ? ' active' : '';
    var num = ['①','②','③','④','⑤','⑥','⑦','⑧'][i];
    htmlEn += '<button class="font-btn' + active + '" onclick="pickFontNew(\'' + stateKey + '\',\'' + f.key + '\')">' +
      '<span class="fn" style="margin-bottom:2px">' + num + '</span>' +
      '<span style="font-family:\'' + f.family + '\';font-style:' + f.style + ';font-weight:' + f.weight + '">Wanderlust</span>' +
      '</button>';
  }
  for (var j=0; j<FONTS_KR.length; j++) {
    var fk = FONTS_KR[j];
    var activeK = (st[stateKey] === fk.key) ? ' active' : '';
    var numK = ['①','②','③'][j];
    htmlKr += '<button class="font-btn' + activeK + '" onclick="pickFontNew(\'' + stateKey + '\',\'' + fk.key + '\')">' +
      '<span class="fn" style="margin-bottom:2px">' + numK + '</span>' +
      '<span style="font-family:\'' + fk.family + '\';font-style:' + fk.style + ';font-weight:' + fk.weight + '">완더러스트</span>' +
      '</button>';
  }
  enEl.innerHTML = htmlEn;
  krEl.innerHTML = htmlKr;
}

function buildGrid(elId, stateKey) { buildFontGrid(); }

function pickFontNew(stateKey, key) {
  st[stateKey] = key;
  buildFontGrid();
  render();
}

function buildEmoji() {
  var el = document.getElementById('emojiGrid');
  var html = '';
  for (var i=0; i<ICON_DATA.length; i++) {
    var ic = ICON_DATA[i];
    html += '<button class="emoji-btn" title="' + ic.label + '" onclick="insertEmoji(\'' + ic.key + '\')">' +
      ic.svg + '<span class="fn">' + ic.label + '</span>' +
      '</button>';
  }
  el.innerHTML = html;
}

var lastInp = 'in1';
function updateFontHint() {
  var h = document.getElementById('fontTabHint');
  if (h) h.textContent = lastInp === 'in2' ? '2번째 줄' : '1번째 줄';
}
function insertEmoji(key) {
  var inp = document.getElementById(lastInp);
  var start = inp.selectionStart;
  var end = inp.selectionEnd;
  var token = '[' + key + ']';
  inp.value = inp.value.slice(0, start) + token + inp.value.slice(end);
  inp.selectionStart = inp.selectionEnd = start + token.length;
  inp.focus();
  render();
}

function pickFont(elId, stateKey, key) {
  st[stateKey] = key;
  buildGrid(elId, stateKey);
  render();
}

function setLines(n) {
  st.lines = n;
  document.getElementById('btn1').classList.toggle('active', n===1);
  document.getElementById('btn2').classList.toggle('active', n===2);
  document.querySelector('.label-container').classList.toggle('two-line', n===2);
  document.getElementById('in2wrap').style.display = n===2 ? '' : 'none';
  document.getElementById('fontLineTabs').style.display = n===2 ? 'flex' : 'none';
  document.getElementById('szRow2').style.display = n===2 ? 'flex' : 'none';
  document.getElementById('szlbl1').textContent = n===2 ? '1번째 줄' : '텍스트';
  document.getElementById('lbl1').textContent = n===2 ? '1번째 줄' : '텍스트';
  if (n===1) { fontTab = 1; }
  buildFontGrid();
  render();
}

function setSz(line, sz) {
  if (line===1) {
    st.sz1 = sz;
    ['s','m','l'].forEach(function(s){ document.getElementById('s1'+s).classList.toggle('active', s===sz); });
  } else {
    st.sz2 = sz;
    ['s','m','l'].forEach(function(s){ document.getElementById('s2'+s).classList.toggle('active', s===sz); });
  }
  render();
}

function render() {
  var d1 = document.getElementById('d1');
  var d2 = document.getElementById('d2');
  var t1 = document.getElementById('in1').value || 'Your Text';
  var t2 = document.getElementById('in2').value || '';
  var f1 = fObj(st.f1);
  d1.style.fontFamily = "'" + f1.family + "', serif";
  d1.style.fontStyle = f1.style;
  d1.style.fontWeight = f1.weight;

  var hasT2 = t2.length > 0;
  document.querySelector('.label-container').classList.toggle('two-line', hasT2);

  var px1 = hasT2 ? SZ.two1[st.sz1] : SZ.one[st.sz1];
  d1.style.fontSize = px1 + 'px';

  var f2 = fObj(st.f2);
  d2.style.fontFamily = "'" + f2.family + "', serif";
  d2.style.fontStyle = f2.style;
  d2.style.fontWeight = f2.weight;
  d2.style.fontSize = SZ.two2[st.sz2] + 'px';
  d2.style.display = hasT2 ? 'block' : 'none';

  function applyTokens(el, text, px) {
    var iconStyle = 'display:inline-block;vertical-align:middle;width:' + px + 'px;height:' + px + 'px;';
    var hasToken = /\[[a-z0-9]+\]/.test(text);
    if (hasToken) {
      var html = text.replace(/\[([a-z0-9]+)\]/g, function(match, key) {
        var ic = ICON_DATA.find(function(x){return x.key===key;});
        if (!ic) return match;
        return ic.svg.replace('<svg ', '<svg style="' + iconStyle + '" ');
      });
      el.innerHTML = html;
    } else {
      el.textContent = text;
    }
  }

  applyTokens(d1, t1, px1);
  if (hasT2) {
    var curPx2 = parseInt(d2.style.fontSize) || 18;
    applyTokens(d2, t2, curPx2);
  }
}

buildFontGrid();
buildEmoji();
render();

</script>
